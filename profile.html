<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ sơ của bạn</title>
  </head>
  <body style="background: #fff0f5; margin: 0; font-family: system-ui, -apple-system, sans-serif;">
    <div id="profile-page" style="min-height: 100vh; display: flex; flex-direction: column; background: #fff;">
        <div style="width: 100%; display: flex; flex-direction: column;" id="profile-content">
            <!-- Header -->
            <div style="background: #e94560; padding: 20px 30px; position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                <button id="btn-back-home" style="position: absolute; left: 20px; background: rgba(255,255,255,0.2); border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'" title="Quay lại Trang Chủ">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                </button>
                <h2 style="margin: 0; color: white; font-size: 1.8rem; font-weight: 700;">Hồ sơ Cá nhân</h2>
            </div>
            
            <div style="padding: 60px 40px; display: flex; flex-direction: row; flex-wrap: wrap; gap: 60px; justify-content: center; align-items: flex-start; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box;">
                <!-- Avatar Area (Cột Trái) -->
                <div style="display: flex; flex-direction: column; align-items: center; gap: 15px; flex: 1; min-width: 250px;">
                    <div style="position: relative; width: 200px; height: 200px;">
                        <img id="profile-avatar-preview" src="" style="width: 200px; height: 200px; border-radius: 50%; object-fit: cover; border: 5px solid #ffb6c1; background: #fff; display: block; box-shadow: 0 5px 15px rgba(0,0,0,0.1);" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
                        <div id="profile-avatar-fallback" style="width: 200px; height: 200px; border-radius: 50%; background: #fff0f5; border: 5px solid #ffb6c1; display: none; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#e94560" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <!-- Upload Button Overlay -->
                        <label for="avatar-upload" style="position: absolute; bottom: 10px; right: 10px; background: #e94560; color: white; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(233,69,96,0.4); transition: transform 0.2s, background 0.2s;" onmouseover="this.style.transform='scale(1.1)'; this.style.background='#d13d56';" onmouseout="this.style.transform='scale(1)'; this.style.background='#e94560';" title="Đổi ảnh đại diện">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                        </label>
                        <input type="file" id="avatar-upload" accept="image/*" style="display: none;" />
                    </div>
                    <div style="font-size: 0.9rem; color: #777; text-align: center; max-width: 250px; line-height: 1.4;">Tải lên bức ảnh đẹp nhất của bạn. Khuyên dùng ảnh vuông, kích thước &lt; 2MB.</div>
                </div>

                <!-- Info Form (Cột Phải) -->
                <div style="flex: 2; min-width: 300px; display: flex; flex-direction: column; gap: 25px;">
                    <div style="background: #fdfdfd; padding: 30px; border-radius: 15px; border: 1px solid #eaeaea; box-shadow: 0 2px 8px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 20px;">
                        
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600; font-size: 1rem; color: #444;">Tên hiển thị</label>
                            <input type="text" id="profile-display-name" placeholder="Tên của bạn..." style="padding: 14px 18px; border-radius: 12px; border: 1.5px solid #ddd; outline: none; font-size: 1.05rem; transition: border-color 0.2s, box-shadow 0.2s;" onfocus="this.style.borderColor='#e94560'; this.style.boxShadow='0 0 0 3px rgba(233,69,96,0.1)';" onblur="this.style.borderColor='#ddd'; this.style.boxShadow='none';" />
                        </div>
                        
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600; font-size: 1rem; color: #444;">Biệt danh (AI sẽ gọi bạn bằng tên này)</label>
                            <input type="text" id="profile-nickname" placeholder="Biệt danh..." style="padding: 14px 18px; border-radius: 12px; border: 1.5px solid #ddd; outline: none; font-size: 1.05rem; transition: border-color 0.2s, box-shadow 0.2s;" onfocus="this.style.borderColor='#e94560'; this.style.boxShadow='0 0 0 3px rgba(233,69,96,0.1)';" onblur="this.style.borderColor='#ddd'; this.style.boxShadow='none';" />
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 12px; border-top: 1.5px dashed #eee; padding-top: 20px; margin-top: 5px;">
                            <div style="font-size: 1rem; color: #555; display: flex; align-items: center; gap: 10px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                                <span style="font-weight: 600;">Email:</span> <span id="profile-email">--</span>
                            </div>
                            <div style="font-size: 1rem; color: #555; display: flex; align-items: center; gap: 10px;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                                <span style="font-weight: 600;">Ngày tham gia:</span> <span id="profile-created">--</span>
                            </div>
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 15px; margin-top: auto;">
                        <button id="btn-save-profile" style="flex: 2; background: #4CAF50; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: transform 0.1s, background 0.2s; box-shadow: 0 4px 10px rgba(76,175,80,0.3);" onmouseover="this.style.background='#45a049'" onmouseout="this.style.background='#4CAF50'" onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">Lưu thay đổi</button>
                        <button id="btn-logout" style="flex: 1; background: #f44336; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: transform 0.1s, background 0.2s; box-shadow: 0 4px 10px rgba(244,67,54,0.3);" onmouseover="this.style.background='#da190b'" onmouseout="this.style.background='#f44336'" onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                            Đăng xuất
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Avatar Cropper Modal (chỉ hiện khi đang cắt ảnh) -->
    <div id="cropper-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9); z-index: 3000; justify-content: center; align-items: center; flex-direction: column;">
        <div style="width: 90%; max-width: 600px; height: 60vh; background: #fff; border-radius: 10px; overflow: hidden; margin-bottom: 20px;">
            <img id="cropper-image" src="" style="max-width: 100%; display: block;" />
        </div>
        <div style="display: flex; gap: 15px;">
            <button id="btn-cancel-crop" style="background: #666; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 1rem; cursor: pointer;">Hủy</button>
            <button id="btn-apply-crop" style="background: #e94560; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: bold;">Cắt & Áp dụng</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 9999;"></div>

    <script type="module" src="/src/profile-main.ts"></script>
  </body>
</html>
