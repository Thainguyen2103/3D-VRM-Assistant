<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D VRM Assistant — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
        background: url('/wallpaper.png') no-repeat center center;
        background-size: cover;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      
      /* Lớp phủ mờ cho hình nền đỡ chói */
      .bg-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(161, 140, 209, 0.4) 0%, rgba(251, 194, 235, 0.3) 50%, rgba(255, 241, 235, 0.5) 100%);
        pointer-events: none;
        z-index: 1;
      }

      /* Animated background particles */
      .bg-particle {
        position: fixed;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255,255,255,0.5);
        animation: float-particle linear infinite;
        pointer-events: none;
      }

      @keyframes float-particle {
        0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
      }

      /* Language Switcher Container */
      .login-lang-container {
        position: fixed;
        top: 20px;
        right: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 240, 245, 0.92);
        padding: 5px 12px;
        border-radius: 20px;
        border: 2px solid #ffb6c1;
        box-shadow: 0 4px 15px rgba(233, 69, 96, 0.2);
        backdrop-filter: blur(10px);
        z-index: 100;
        color: #e94560;
        transition: box-shadow 0.2s, transform 0.2s;
      }
      .login-lang-container:hover {
        box-shadow: 0 6px 20px rgba(233, 69, 96, 0.3);
        transform: scale(1.02);
      }
      .login-lang-container i { width: 18px; height: 18px; }

      /* Custom Select styles copied from style.css */
      .custom-select-wrapper { position: relative; font-family: inherit; font-size: 0.9rem; font-weight: bold; }
      .custom-select-display {
        padding: 4px 8px;
        background: transparent;
        border: none;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #e94560;
        min-height: 28px;
      }
      .custom-select-display:hover { opacity: 0.8; }
      .custom-select-arrow svg { transition: transform 0.3s; color: #e94560; width: 14px; height: 14px; margin-left: 4px; }
      .custom-select-wrapper.open .custom-select-arrow svg { transform: rotate(180deg); }
      .custom-select-options {
        position: absolute;
        top: 100%; left: 0; right: 0;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(10px);
        border: 1px solid #ffb6c1;
        border-radius: 8px;
        overflow-y: auto;
        max-height: 200px;
        z-index: 999;
        display: none;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        padding: 5px 0;
        min-width: 140px;
        margin-top: 8px;
      }
      .custom-select-options::-webkit-scrollbar { width: 4px; }
      .custom-select-options::-webkit-scrollbar-thumb { background: #ff9fb2; border-radius: 2px; }
      .custom-select-wrapper.open .custom-select-options {
        display: block;
        animation: fadeInDown 0.2s ease forwards;
      }
      @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .custom-select-option {
        padding: 8px 12px; cursor: pointer; transition: background 0.2s; color: #555; font-weight: normal;
      }
      .custom-select-option:hover { background: rgba(233, 69, 96, 0.1); color: #e94560; }
      .custom-select-option.selected { background: rgba(233, 69, 96, 0.15); color: #e94560; font-weight: bold; }

      /* Auth Card */
      .auth-card {
        background: rgba(255, 240, 245, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        border: 1.5px solid rgba(255, 182, 193, 0.6);
        box-shadow: 0 20px 60px rgba(233, 69, 96, 0.15), 0 4px 20px rgba(0,0,0,0.08);
        padding: 44px 40px 36px;
        width: 420px;
        max-width: 94vw;
        text-align: center;
        animation: card-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        position: relative;
        z-index: 10;
      }

      @keyframes card-in {
        from { opacity: 0; transform: translateY(30px) scale(0.95); }
        to   { opacity: 1; transform: translateY(0)    scale(1); }
      }

      .auth-card h2 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        font-weight: 800;
        color: #e94560;
        letter-spacing: -0.3px;
      }

      .auth-card p.subtitle {
        margin: 0 0 24px;
        font-size: 0.88rem;
        color: #777;
        line-height: 1.5;
      }

      .auth-form-view { display: block; }
      .auth-form { display: flex; flex-direction: column; gap: 12px; }

      .auth-form input {
        padding: 13px 16px;
        border-radius: 12px;
        border: 1.5px solid #f0c0cc;
        background: rgba(255,255,255,0.8);
        font-size: 0.95rem;
        font-family: inherit;
        color: #333;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .auth-form input:focus {
        border-color: #e94560;
        box-shadow: 0 0 0 3px rgba(233,69,96,0.1);
      }
      .auth-form input::placeholder { color: #bbb; }

      .bone-btn {
        width: 100%;
        padding: 13px 20px;
        border-radius: 12px;
        border: none;
        font-size: 0.98rem;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
        margin-top: 4px;
      }
      .bone-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
      .bone-btn:active { transform: translateY(0); }

      #btn-login-submit {
        background: #e94560;
        color: #fff;
        box-shadow: 0 4px 15px rgba(233, 69, 96, 0.35);
      }

      #btn-register-submit {
        background: #ffe4e1;
        color: #e94560;
        border: 2px solid #ffb6c1;
      }

      .auth-switch-text {
        margin-top: 14px;
        font-size: 0.88rem;
        color: #777;
      }
      .auth-switch-text a {
        color: #e94560;
        font-weight: 700;
        text-decoration: none;
      }
      .auth-switch-text a:hover { text-decoration: underline; }

      .auth-divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 18px 0;
        color: #bbb;
        font-size: 0.85rem;
      }
      .auth-divider::before,
      .auth-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #f0c0cc;
      }

      .google-btn {
        background: #fff;
        color: #444;
        border: 1.5px solid #ddd;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      }
      .google-btn:hover { background: #f8f8f8; }

      .guest-btn {
        background: #f2f2f2;
        color: #888;
        border: 1.5px solid #e0e0e0;
        margin-top: 8px;
        font-size: 0.85rem;
      }
      .guest-btn:hover { background: #e8e8e8; }

      .loading-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(255,240,245,0.7);
        backdrop-filter: blur(5px);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
      }
      .loading-overlay.show { display: flex; }
      .loading-spinner {
        width: 44px; height: 44px;
        border: 4px solid #ffb6c1;
        border-top-color: #e94560;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      .loading-overlay p { color: #e94560; font-weight: 700; font-size: 1rem; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Loading overlay when redirecting -->
    <div class="loading-overlay" id="loading-overlay">
      <div class="loading-spinner"></div>
      <p id="loading-overlay-text">Đang đăng nhập...</p>
    </div>

    <!-- Language Switcher -->
    <div class="login-lang-container">
      <i data-lucide="languages"></i>
      <select id="login-language-select">
        <option value="vi" data-flag="vn" data-i18n="lang.vi">Tiếng Việt</option>
        <option value="en" data-flag="gb" data-i18n="lang.en">English</option>
        <option value="ja" data-flag="jp" data-i18n="lang.ja">日本語</option>
        <option value="zh" data-flag="cn" data-i18n="lang.zh">中文</option>
        <option value="ko" data-flag="kr" data-i18n="lang.ko">한국어</option>
      </select>
    </div>

    <!-- Floating particles -->
    <div class="bg-overlay"></div>
    <div class="bg-particle" style="left:10%;animation-duration:8s;animation-delay:0s;width:8px;height:8px;z-index:2;"></div>
    <div class="bg-particle" style="left:20%;animation-duration:10s;animation-delay:2s;z-index:2;"></div>
    <div class="bg-particle" style="left:35%;animation-duration:7s;animation-delay:1s;width:4px;height:4px;z-index:2;"></div>
    <div class="bg-particle" style="left:50%;animation-duration:12s;animation-delay:0.5s;width:10px;height:10px;z-index:2;"></div>
    <div class="bg-particle" style="left:65%;animation-duration:9s;animation-delay:3s;z-index:2;"></div>
    <div class="bg-particle" style="left:80%;animation-duration:11s;animation-delay:1.5s;width:5px;height:5px;z-index:2;"></div>
    <div class="bg-particle" style="left:90%;animation-duration:6s;animation-delay:2.5s;width:7px;height:7px;z-index:2;"></div>

    <!-- Auth Card -->
    <div class="auth-card">
      <h2 data-i18n="auth.title">🌸 Kết nối cùng Citlali 🌸</h2>
      <p class="subtitle" data-i18n="auth.subtitle">Đăng nhập để Citlali có thể ghi nhớ những câu chuyện của riêng hai ta nhé!</p>

      <!-- Login View -->
      <div id="login-view" class="auth-form-view">
        <div class="auth-form">
          <input type="email" id="login-email" placeholder="Email" data-i18n="auth.email" autocomplete="email" />
          <input type="password" id="login-password" placeholder="Mật khẩu" data-i18n="auth.password" autocomplete="current-password" />
          <button id="btn-login-submit" class="bone-btn" data-i18n="btn.login">Đăng nhập</button>
        </div>
        <p class="auth-switch-text">
          <span data-i18n="auth.no_account">Chưa có tài khoản?</span>
          <a href="#" id="link-to-register" data-i18n="auth.register_now">Đăng ký ngay</a>
        </p>
      </div>

      <!-- Register View -->
      <div id="register-view" class="auth-form-view" style="display:none;">
        <div class="auth-form">
          <input type="email" id="register-email" placeholder="Email" data-i18n="auth.email" autocomplete="email" />
          <input type="password" id="register-password" placeholder="Mật khẩu" data-i18n="auth.password" autocomplete="new-password" />
          <input type="password" id="register-password-confirm" placeholder="Nhập lại mật khẩu" data-i18n="auth.confirm_password" autocomplete="new-password" />
          <button id="btn-register-submit" class="bone-btn" data-i18n="auth.register">Đăng ký</button>
        </div>
        <p class="auth-switch-text">
          <span data-i18n="auth.has_account">Đã có tài khoản?</span>
          <a href="#" id="link-to-login" data-i18n="btn.login">Đăng nhập</a>
        </p>
      </div>

      <!-- Divider -->
      <div class="auth-divider"><span data-i18n="auth.or">hoặc</span></div>

      <!-- Google Login -->
      <button id="btn-google-login" class="bone-btn google-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span data-i18n="auth.google">Đăng nhập với Google</span>
      </button>

      <!-- Guest Mode -->
      <button id="btn-guest" class="bone-btn guest-btn" data-i18n="auth.guest">Chế độ Khách (Không lưu dữ liệu)</button>
    </div>

    <script type="module" src="/src/login.ts"></script>
  </body>
</html>
