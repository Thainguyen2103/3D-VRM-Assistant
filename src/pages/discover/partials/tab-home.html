<div id="tab-home" class="tab-content active">
  <div
    style="display: flex; flex-direction: column; align-items: center; padding: 40px; max-width: 1400px; margin: 0 auto; height: calc(100vh - 180px);">

    <div
      style="display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 40px; width: 100%; height: 100%;">
      <!-- Nhân Vật -->
      <div class="upload-option-card tab-btn" data-tab="tab-list"
        style="padding: 0; overflow: hidden; border-radius: 24px; border: 2px solid #eef2f6; cursor: pointer; position: relative; height: 100%; display: flex; align-items: center; justify-content: center;">
        <div
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('/image_char.jpg'); background-size: cover; background-position: center; z-index: 1;">
        </div>
        <div
          style="position: relative; z-index: 10; background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 8px 25px; border-radius: 50px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.5);">
          <span style="font-size: 2rem; font-weight: 700; color: #333; font-family: 'Baloo 2', cursive; margin: 0;" data-i18n="discover.home.characters">Nhân Vật</span>
        </div>
      </div>

      <!-- Animation -->
      <div class="upload-option-card tab-btn" data-tab="tab-animation"
        style="padding: 0; overflow: hidden; border-radius: 24px; border: 2px solid #eef2f6; cursor: pointer; position: relative; height: 100%; display: flex; align-items: center; justify-content: center;">
        <div
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('/image_animation.png'); background-size: cover; background-position: top center; z-index: 1;">
        </div>
        <div
          style="position: relative; z-index: 10; background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 8px 25px; border-radius: 50px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.5);">
          <span style="font-size: 2rem; font-weight: 700; color: #333; font-family: 'Baloo 2', cursive; margin: 0;" data-i18n="discover.home.animations">Animation</span>
        </div>
      </div>

      <!-- Giao Diện -->
      <div class="upload-option-card tab-btn" data-tab="tab-theme"
        style="padding: 0; overflow: hidden; border-radius: 24px; border: 2px solid #eef2f6; cursor: pointer; position: relative; height: 100%; display: flex; align-items: center; justify-content: center;">
        <div
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('/image_display.jpg'); background-size: cover; background-position: center; z-index: 1;">
        </div>
        <div
          style="position: relative; z-index: 10; background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 8px 25px; border-radius: 50px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.5);">
          <span style="font-size: 2rem; font-weight: 700; color: #333; font-family: 'Baloo 2', cursive; margin: 0;" data-i18n="discover.home.themes">Giao Diện</span>
        </div>
      </div>

      <!-- Sắp ra mắt -->
      <div class="upload-option-card"
        style="padding: 0; overflow: hidden; border-radius: 24px; border: 2px dashed #d0d7de; cursor: default; position: relative; height: 100%; display: flex; align-items: center; justify-content: center; background: #f8f9fa; box-shadow: none;">
        <i data-lucide="plus"
          style="position: absolute; width: 150px; height: 150px; color: #cbd5e1; opacity: 0.3; transform: rotate(15deg); left: -20px; top: -20px; z-index: 1;"></i>
        <div
          style="position: relative; z-index: 10; background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 8px 25px; border-radius: 50px; border: 1px dashed #d0d7de;">
          <span style="font-size: 2rem; font-weight: 700; color: #999; font-family: 'Baloo 2', cursive; margin: 0;" data-i18n="discover.home.new_features">Tính năng mới</span>
        </div>
      </div>
    </div>
  </div>
</div>
