<div id="tab-upload-options" class="tab-content">
  <div style="display: flex; flex-direction: column; align-items: center; padding: 40px; max-width: 1000px; margin: 0 auto; height: calc(100vh - 180px);">
    <h3 style="font-family: 'Baloo 2', cursive; font-size: 2.2rem; color: #3f51b5; margin-bottom: 40px;" data-i18n="discover.upload_options.title">Bạn muốn đăng tải gì?</h3>
    <div style="display: flex; gap: 30px; width: 100%; justify-content: center;">
      <!-- Nhân Vật -->
      <button class="upload-option-card tab-btn" data-tab="tab-upload" style="flex: 1; max-width: 250px; background: white; padding: 40px 20px; border-radius: 20px; border: 2px solid #eef2f6; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 20px; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.02);" onmouseover="this.style.borderColor='#3f51b5'; this.style.transform='translateY(-5px)'; this.style.boxShadow='0 10px 20px rgba(63,81,181,0.1)'" onmouseout="this.style.borderColor='#eef2f6'; this.style.transform='none'; this.style.boxShadow='0 4px 6px rgba(0,0,0,0.02)'">
        <div style="width: 80px; height: 80px; border-radius: 50%; background: #e8eaf6; display: flex; align-items: center; justify-content: center; color: #3f51b5;">
          <i data-lucide="user" style="width: 40px; height: 40px;"></i>
        </div>
        <span style="font-size: 1.4rem; font-weight: 700; color: #333; font-family: 'Baloo 2', cursive;" data-i18n="discover.upload_options.character">Nhân Vật</span>
      </button>

      <!-- Animation -->
      <button class="upload-option-card tab-btn" data-tab="tab-upload-animation" style="flex: 1; max-width: 250px; background: white; padding: 40px 20px; border-radius: 20px; border: 2px solid #eef2f6; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 20px; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.02);" onmouseover="this.style.borderColor='#3f51b5'; this.style.transform='translateY(-5px)'; this.style.boxShadow='0 10px 20px rgba(63,81,181,0.1)'" onmouseout="this.style.borderColor='#eef2f6'; this.style.transform='none'; this.style.boxShadow='0 4px 6px rgba(0,0,0,0.02)'">
        <div style="width: 80px; height: 80px; border-radius: 50%; background: #e8eaf6; display: flex; align-items: center; justify-content: center; color: #3f51b5;">
          <i data-lucide="video" style="width: 40px; height: 40px;"></i>
        </div>
        <span style="font-size: 1.4rem; font-weight: 700; color: #333; font-family: 'Baloo 2', cursive;" data-i18n="discover.upload_options.animation">Animation</span>
      </button>

      <!-- Giao Diện -->
      <button class="upload-option-card tab-btn" data-tab="tab-upload-theme" style="flex: 1; max-width: 250px; background: white; padding: 40px 20px; border-radius: 20px; border: 2px solid #eef2f6; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 20px; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.02);" onmouseover="this.style.borderColor='#3f51b5'; this.style.transform='translateY(-5px)'; this.style.boxShadow='0 10px 20px rgba(63,81,181,0.1)'" onmouseout="this.style.borderColor='#eef2f6'; this.style.transform='none'; this.style.boxShadow='0 4px 6px rgba(0,0,0,0.02)'">
        <div style="width: 80px; height: 80px; border-radius: 50%; background: #e8eaf6; display: flex; align-items: center; justify-content: center; color: #3f51b5;">
          <i data-lucide="layout" style="width: 40px; height: 40px;"></i>
        </div>
        <span style="font-size: 1.4rem; font-weight: 700; color: #333; font-family: 'Baloo 2', cursive;" data-i18n="discover.upload_options.theme">Giao Diện</span>
      </button>
    </div>
  </div>
</div>
